# Banco em memória para facilitar a execução e a verificação do mapeamento JPA nesta etapa.
spring.datasource.url=jdbc:h2:mem:nexum;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nesta etapa não existem Controllers nem endpoints HTTP.
spring.main.web-application-type=none
